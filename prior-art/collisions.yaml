  # === Commitment Theory ===

  - term: "Commitment Theory"
    canonical_moses_meaning: "Framework studying deontic content preservation in signals under transformation"
    status: OWN
    collisions:
      - field: "Philosophy of language"
        external_use: "Brandom (1994) — discursive commitment as inferential obligations of speakers in discourse"
        conceptual_overlap: "MODERATE-HIGH"
        material_difference: "CT: property of SIGNALS. Brandom: property of AGENTS. Categorical distinction."
        institutional_anchoring: "Harvard University Press"
        citation: "Brandom, R.B. (1994). Making It Explicit."
        action: "Disambiguate in every public document. See Disambiguation_Guide.md."

      - field: "Dialogue logic"
        external_use: "Walton & Krabbe (1995) — commitment stores as propositions a dialogue participant has accepted"
        conceptual_overlap: "HIGH"
        material_difference: "CT: synchronic property of a signal. Walton/Krabbe: diachronic record of dialogue history."
        institutional_anchoring: "Cambridge University Press"
        citation: "Walton, D.N. & Krabbe, E.C.W. (1995). Commitment in Dialogue."
        action: "Disambiguate."

      - field: "NLP / Computational linguistics"
        external_use: "CommitmentBank (de Marneffe et al., 2019) — speaker commitment to factuality of embedded clauses"
        conceptual_overlap: "MODERATE"
        material_difference: "CT: does the signal still obligate Y after transformation? CommitmentBank: how certain is the speaker that X happened?"
        institutional_anchoring: "Society for Computation in Linguistics"
        citation: "de Marneffe, M.-C. et al. (2019). The CommitmentBank."
        action: "Disambiguate."

      - field: "Multiagent systems"
        external_use: "Singh (1999) — social commitments in multiagent systems, inter-agent deontic relationships"
        conceptual_overlap: "HIGH"
        material_difference: "CT: signal-side conservation under transformation. Singh: inter-agent obligation network."
        institutional_anchoring: "Artificial Intelligence and Law"
        citation: "Singh, M.P. (1999). An ontology for commitments in multiagent systems."
        action: "Disambiguate."

      - field: "Organizational psychology"
        external_use: "Meyer & Allen (1991) — three-component model of organizational commitment"
        conceptual_overlap: "LOW"
        material_difference: "CT: semantic invariant. Meyer/Allen: psychological bond to organization."
        institutional_anchoring: "Human Resource Management Review"
        citation: "Meyer, J.P. & Allen, N.J. (1991)."
        action: "Disambiguate."

      - field: "Organizational psychology"
        external_use: "Solinger et al. (2019) — Commitment System Theory"
        conceptual_overlap: "LOW"
        material_difference: "CT: semantic invariants under transformation. CST: psychological network of commitments."
        institutional_anchoring: "Academy of Management Review"
        citation: "Solinger, O. et al. (2019). Commitment System Theory."
        action: "Disambiguate."

      - field: "Behavioral psychology"
        external_use: "Kiesler — commitment theory of behavioral commitment"
        conceptual_overlap: "LOW"
        material_difference: "CT: signal-side deontic invariant. Kiesler: person becoming bound to their behavior."
        institutional_anchoring: "ScienceDirect"
        citation: "Kiesler, C.A. (1971)."
        action: "Disambiguate."

      - field: "Philosophy of language"
        external_use: "Peirce — commitment theory of assertion"
