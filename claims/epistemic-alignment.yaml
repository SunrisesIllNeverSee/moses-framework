# Framework Claims — Epistemic Alignment Extension
#
# This file extends claims/claims-registry.yaml with:
#   - basis (why the claim is believed)
#   - limitations (known uncertainties)
#   - search_authority_binding (link to SA canonical record)
#
# CRITICAL: Framework epistemic states (DEFINED, OBSERVED, etc.) are
# PRESERVED and NOT collapsed into Search Authority approval states.
# Both states coexist:
#   Framework: CT-002 status: OBSERVED
#   SA: CL-PROBLEM-001 canonical_status: source_supported
#
# Schema version: 1
# Created: 2026-09-04
# Phase: 9

schema_version: 1

# ---------------------------------------------------------------------------
# Alignment extensions
# ---------------------------------------------------------------------------
# Each entry references a claim in claims-registry.yaml by ID.

alignment_extensions:

  CT-001:
    basis:
      summary: >-
        Commitment is defined as the minimal identity-preserving deontic
        invariant of a signal. This is a definitional claim from the v05
        paper (Definition 2.4) and P-000 prospectus (Proposition 1.3).
      source_references:
        - DOI:10.5281/zenodo.20031715
        - DOI:10.5281/zenodo.20029607
    limitations:
      - "The choice of extractor is empirical — the definition is not, but operationalizing it is."
      - "Only deontic signals have been tested; other signal types are not claimed."
    search_authority_binding:
      sa_claim_id: CL-DEF-001
      sa_epistemic_extension: true
      sa_canonical_status: disputed
      notes: >-
        SA marks this as disputed because the interpretive wording is
        under owner review. The Framework status remains DEFINED.
        Both states are valid and coexist.

  CT-002:
    basis:
      summary: >-
        Governed transformations conserve commitment. Supported by
        EXP-001 through EXP-007 (3,950 run entries, 0.94 vs 0.42
        stability separation).
      source_references:
        - DOI:10.5281/zenodo.20029607
        - DOI:10.5281/zenodo.19105225
    limitations:
      - "Proof-of-concept scale (20 signals, 100 sentences, 50 code snippets, 25 proofs)."
      - "Not yet replicated at >10,000 samples."
      - "No cross-model replication (Claude, Llama, GPT-4)."
      - "NLI oracle may not be transitive."
      - "Jaccard is blind to NP-negation forms (EXP-007)."
      - "9 failure modes discovered."
    search_authority_binding:
      sa_claim_id: CL-PROBLEM-001
      sa_epistemic_extension: true
      sa_canonical_status: source_supported
      notes: >-
        SA marks this as source_supported. Framework status is OBSERVED.
        Upgrade to SUPPORTED pending large-scale replication.

  CT-003:
    basis:
      summary: >-
        Without enforcement, commitment degrades. Drift at n >= 3,
        consistent at n >= 5 across all experiments.
      source_references:
        - DOI:10.5281/zenodo.20029607
        - DOI:10.5281/zenodo.19105225
    limitations:
      - "Same corpus limitations as CT-002."
      - "Measurement methodology has blind spots (EXP-007)."
    search_authority_binding:
      sa_claim_id: CL-PROBLEM-001
      sa_epistemic_extension: true
      sa_canonical_status: source_supported

  CT-004:
    basis:
      summary: >-
        The conservation law is explicitly designed as falsifiable with
        operational definitions and a public harness.
      source_references:
        - DOI:10.5281/zenodo.20029607
    limitations:
      - "Falsifiability is a property of the claim design, not the result."
    search_authority_binding:
      sa_claim_id: CL-CLASS-001
      sa_epistemic_extension: true
      sa_canonical_status: source_supported

  CT-005:
    basis:
      summary: >-
        MO§ES enforces commitment conservation via compression gating,
        lineage tracking, and hardware anchoring. Defined in v05 paper
        Section 8.
      source_references:
        - DOI:10.5281/zenodo.20029607
    limitations:
      - "Public-layer specification only — proprietary details excluded."
      - "Canonical wording under owner review."
    search_authority_binding:
      sa_claim_id: MO-DEF-001
      sa_epistemic_extension: true
      sa_canonical_status: disputed
      notes: >-
        SA marks as disputed because canonical wording is under review.
        Framework status remains DEFINED. Both coexist.

  CT-006:
    basis:
      summary: >-
        The harness is explicitly a proxy measurement tool, not the
        production enforcement implementation.
      source_references:
        - "CLAUDE.md (commitment-conservation repo)"
    limitations:
      - "Boundary is by design, not a limitation of the research."
    search_authority_binding:
      sa_claim_id: MO-KASSA-BOUNDARY-001
      sa_epistemic_extension: true
      sa_canonical_status: source_supported

  CT-007:
    basis:
      summary: >-
        Commitment is a property of signals, not agents. This is CT's
        core ontological commitment, distinguishing it from Brandom,
        Walton & Krabbe, and CommitmentBank.
      source_references:
        - DOI:10.5281/zenodo.20031715
    limitations:
      - "Definitional — the choice to attribute commitment to signals is a design decision."
    search_authority_binding:
      sa_claim_id: null
      notes: "No direct SA claim binding yet."

  CT-008:
    basis:
      summary: >-
        Nine novel concepts occupy clean conceptual territory with zero
        search results as of April 15, 2026.
      source_references:
        - "Nine_Novel_Concepts.md"
        - "Naming_Architecture.md"
    limitations:
      - "Must use 'in the searched corpus' qualifier."
      - "A prior use discovered later would weaken this claim."
    search_authority_binding:
      sa_claim_id: null
      notes: "No direct SA claim binding yet."

  CT-009:
    basis:
      summary: >-
        Semantic entropy is irreversible without external governance.
        P-000 Proposition 6.3; EXP-001 through EXP-007.
      source_references:
        - DOI:10.5281/zenodo.20031715
    limitations:
      - "Same corpus and methodology limitations as CT-002."
    search_authority_binding:
      sa_claim_id: null
      notes: "No direct SA claim binding yet."

  CT-010:
    basis:
      summary: >-
        The conservation law is substrate independent — it describes a
        property of the signal and transformation constraints, not any
        particular model architecture.
      source_references:
        - DOI:10.5281/zenodo.20031715
    limitations:
      - "Definitional property — not yet tested across substrates."
    search_authority_binding:
      sa_claim_id: null
      notes: "No direct SA claim binding yet."

