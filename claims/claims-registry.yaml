not_claimed:
  - "CT does not claim to have solved the hard problem of intelligence."
  - "CT does not claim that conservation holds for all signal types (only deontic signals have been tested)."
  - "CT does not claim that the harness is the production enforcement implementation."
  - "CT does not claim that the NLI oracle is a valid equivalence relation (it may not be transitive)."
  - "CT does not claim that the corpus is sufficient for the conservation claim to be considered established (it is proof-of-concept scale)."
  - "The intelligence ontology does not claim that BI/AAI/SI are operationally distinguishable (no test exists yet)."
  - "The intelligence ontology does not claim that SI is a participant class (v0.1 treats it as a system property)."
  - "The intelligence ontology does not claim that BI × AAI → SI is established (the × operation is undefined)."
  - "Intelligence Provenance does not claim to trace 'intelligence itself' — it traces intelligence-bearing events."
  - "The framework does not claim personal name attribution ('McHenry's Law' is prohibited by the owner)."
